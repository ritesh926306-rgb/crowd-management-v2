{% extends "base.html" %}

{% block title %}Admin Portal Login - Venue Crowd Control{% endblock %}

{% block content %}
<div style="max-width: 440px; margin: 3rem auto;">
  <div class="card" style="box-shadow: var(--shadow-lg);">
    
    <div style="text-align: center; margin-bottom: 2rem;">
      <div style="width: 60px; height: 60px; background: var(--primary-navy); color: var(--accent-teal); border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; font-size: 1.8rem; margin: 0 auto 1rem;">
        🔐
      </div>
      <h2 style="font-size: 1.5rem; font-weight: 800; color: var(--primary-navy);">Command Center Login</h2>
      <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 0.35rem;">
        Restricted to Authorized Venue Administrators & Coordinators
      </p>
    </div>

    <form action="{{ url_for('admin_login') }}" method="POST">
      <div class="form-group" style="margin-bottom: 1.5rem;">
        <label for="password" style="font-weight: 600;">Administrator Password</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          class="form-control" 
          placeholder="Enter administrator password" 
          required 
          autofocus
        >
        <span class="input-helper">Default: <code>admin123</code></span>
      </div>

      <button type="submit" class="btn btn-navy btn-block btn-lg">
        Unlock Admin Dashboard &rarr;
      </button>
    </form>

    <div style="margin-top: 1.5rem; text-align: center;">
      <a href="{{ url_for('index') }}" style="font-size: 0.85rem; color: var(--text-muted); text-decoration: none;">
        &larr; Back to Visitor Registration
      </a>
    </div>

  </div>
</div>
{% endblock %}
