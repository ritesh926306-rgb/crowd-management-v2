name: Build, Test & Deploy to Production

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  deployments: write

jobs:
  test:
    name: 🧪 Run Security & Unit Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt

    - name: Execute Test Suite
      run: |
        python -m unittest discover -s backend -p "test_*.py"

  build-and-publish-container:
    name: 🐳 Build & Publish Container to GHCR
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract Metadata (Tags, Labels)
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository }}
        tags: |
          type=raw,value=latest
          type=sha

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy-cloud:
    name: 🚀 Cloud Deployment Trigger
    needs: [test, build-and-publish-container]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://venue-crowd-management.onrender.com

    steps:
    - name: Trigger Render Cloud Webhook (If Configured)
      env:
        DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      run: |
        if [ -n "$DEPLOY_HOOK" ]; then
          echo "Triggering cloud deploy hook..."
          curl -s -X POST "$DEPLOY_HOOK"
          echo "Cloud deployment triggered successfully!"
        else
          echo "Deploy container published to ghcr.io/${{ github.repository }}:latest"
          echo "Ready for zero-downtime deployment."
        fi
