name: Automated Production Deployment

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Verify Code Quality
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install Backend Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt

    - name: Execute Security & HMAC Integrity Tests
      run: |
        python -m unittest discover -s backend -p "test_*.py"

  deploy:
    name: Deploy to Production Cloud
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Trigger Cloud Deployment Webhook
      env:
        DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      run: |
        if [ -n "$DEPLOY_HOOK" ]; then
          echo "Triggering automated cloud deployment webhook..."
          curl -s -X POST "$DEPLOY_HOOK"
          echo "Deployment webhook successfully triggered!"
        else
          echo "Notice: RENDER_DEPLOY_HOOK_URL secret not configured yet."
          echo "Repository is tested and ready for automatic 1-click cloud sync."
        fi
