name: Deploy Frontend, Backend & Database via GitHub Actions

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

# Permissions required for GitHub Pages and GitHub Container Registry deployment
permissions:
  contents: read
  pages: write
  id-token: write
  packages: write
  deployments: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # -----------------------------------------------------------------
  # 1. DATABASE & BACKEND VERIFICATION (Live MySQL 8.0 Service)
  # -----------------------------------------------------------------
  database-and-backend-test:
    name: 🗄️ Test Database (MySQL 8.0) & Backend APIs
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: venue_crowd
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt

    - name: Initialize and Verify MySQL Database Schema
      run: |
        mysql -h 127.0.0.1 -P 3306 -u root -prootpassword venue_crowd < backend/schema.sql
        echo "MySQL schema and views successfully deployed!"

    - name: Execute Backend Tests Against Live Database
      env:
        DB_TYPE: mysql
        DB_HOST: 127.0.0.1
        DB_PORT: 3306
        DB_USER: root
        DB_PASSWORD: rootpassword
        DB_NAME: venue_crowd
      run: |
        python -m unittest discover -s backend -p "test_*.py"

  # -----------------------------------------------------------------
  # 2. DEPLOY FRONTEND TO GITHUB PAGES
  # -----------------------------------------------------------------
  deploy-frontend-pages:
    name: 🌐 Deploy Frontend to GitHub Pages
    needs: database-and-backend-test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install Dependencies
      run: |
        python -m pip install jinja2

    - name: Build Frontend Static Site
      run: |
        python frontend/build_static.py

    - name: Setup GitHub Pages
      uses: actions/configure-pages@v5

    - name: Upload Pages Artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: "dist"

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

  # -----------------------------------------------------------------
  # 3. DEPLOY BACKEND TO GITHUB CONTAINER REGISTRY (GHCR)
  # -----------------------------------------------------------------
  deploy-backend-ghcr:
    name: 🐳 Deploy Backend to GitHub Container Registry
    needs: database-and-backend-test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and Push Backend Container
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ghcr.io/${{ github.repository }}:latest
          ghcr.io/${{ github.repository }}:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
