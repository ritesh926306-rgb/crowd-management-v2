{% extends "base.html" %}

{% block title %}Administrator Command Login · VenueGuard{% endblock %}

{% block head %}
<style>
  .app-header { display: none !important; }
  body {
    background: radial-gradient(ellipse 80% 60% at 50% 30%, rgba(123,47,190,0.08) 0%, transparent 70%), #040D18;
    min-height: 100vh;
  }
</style>
{% endblock %}

{% block content %}
<div style="display: flex; align-items: center; justify-content: center; min-height: 85vh; padding: 1.5rem 1rem;">
  <div class="card" style="width: 100%; max-width: 400px; border: 1px solid rgba(123,47,190,0.35); box-shadow: var(--shadow-card), 0 0 50px rgba(123,47,190,0.1); padding: 2rem 1.75rem;">
    
    <!-- Header Icon -->
    <div style="text-align: center; margin-bottom: 1.5rem;">
      <div style="width: 68px; height: 68px; background: rgba(123,47,190,0.15); border: 1.5px solid rgba(123,47,190,0.4); border-radius: var(--radius-lg); display: flex; align-items: center; justify-content: center; font-size: 2rem; margin: 0 auto 1rem; box-shadow: 0 0 25px rgba(123,47,190,0.2);">
        ⚙️
      </div>
      <h1 style="font-size: 1.45rem; font-weight: 800; color: #fff; margin-bottom: 0.3rem;">
        Admin Command Center
      </h1>
      <p style="font-size: 0.82rem; color: var(--text-muted); line-height: 1.5;">
        Enter administrator password or PIN to unlock full management controls.
      </p>
    </div>

    <!-- Error Display -->
    <div id="adminPinError" style="display: none; background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.3); border-radius: var(--radius-sm); color: #FCA5A5; font-size: 0.8rem; padding: 0.6rem 0.8rem; text-align: center; margin-bottom: 1.15rem;"></div>

    <!-- PIN Form -->
    <form action="{{ url_for('admin_login') }}" method="POST" id="adminLoginForm" onsubmit="return handleAdminLogin(event)">
      <div class="form-group" style="margin-bottom: 1.5rem;">
        <label for="adminPasswordInput" style="display: flex; justify-content: space-between; align-items: center; font-size: 0.84rem; font-weight: 700; color: #C084FC; margin-bottom: 0.45rem;">
          <span>Admin Password / PIN</span>
          <span style="font-size: 0.72rem; color: var(--text-muted);">Default: admin123</span>
        </label>
        <div style="position: relative;">
          <input
            type="password"
            id="adminPasswordInput"
            name="password"
            class="form-control"
            placeholder="Enter Admin Password..."
            required
            autofocus
            style="font-size: 1.25rem; letter-spacing: 0.15em; text-align: center; font-family: 'JetBrains Mono', monospace; padding-right: 2.75rem;"
          >
          <button
            type="button"
            onclick="toggleAdminPinVisibility('adminPasswordInput', this)"
            style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: transparent; border: none; color: var(--text-muted); cursor: pointer; font-size: 1.05rem;"
            title="Toggle Password Visibility"
          >👁️</button>
        </div>
      </div>

      <button type="submit" id="adminLoginBtn" class="btn btn-primary btn-block btn-lg" style="background: linear-gradient(135deg, #7B2FBE, #3B5BDB); border: none; font-weight: 800; padding: 0.75rem; box-shadow: 0 4px 20px rgba(123,47,190,0.3);">
        <span>⚙️</span> Unlock Command Center
      </button>
    </form>

    <div style="margin-top: 1.5rem; text-align: center;">
      <a href="{{ url_for('index') }}" style="font-size: 0.8rem; color: var(--text-muted); text-decoration: none;">
        ← Back to Visitor Registration
      </a>
    </div>

  </div>
</div>

<script>
  function toggleAdminPinVisibility(inputId, btn) {
    const input = document.getElementById(inputId);
    if (!input) return;
    if (input.type === 'password') {
      input.type = 'text';
      btn.textContent = '🔒';
    } else {
      input.type = 'password';
      btn.textContent = '👁️';
    }
  }

  function handleAdminLogin(e) {
    const pwd = document.getElementById('adminPasswordInput').value.trim();
    const errBox = document.getElementById('adminPinError');
    errBox.style.display = 'none';

    if (!pwd) {
      errBox.textContent = 'Please enter administrator password.';
      errBox.style.display = 'block';
      e.preventDefault();
      return false;
    }

    // Static mode authentication (localStorage)
    if (window.staticAdminLogin) {
      e.preventDefault();
      const res = window.staticAdminLogin(pwd);
      if (res.success) {
        window.location.href = 'admin.html';
      } else {
        errBox.textContent = res.message || 'Incorrect Administrator Password.';
        errBox.style.display = 'block';
        document.getElementById('adminPasswordInput').value = '';
        document.getElementById('adminPasswordInput').focus();
      }
      return false;
    }

    // Flask Backend Mode
    return true;
  }
</script>
{% endblock %}
